version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: melatea-postgres-postgis
    restart: always
    environment:
      POSTGRES_USER: melatea_admin
      POSTGRES_PASSWORD: melatea_secret_password_2026
      POSTGRES_DB: melatea_partner_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melatea_admin -d melatea_partner_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melatea-web-app
    restart: always
    environment:
      DATABASE_URL: "postgresql://melatea_admin:melatea_secret_password_2026@db:5432/melatea_partner_db?schema=public"
      NODE_ENV: production
      MAP_PROVIDER: openfreemap
      NEXT_PUBLIC_MAP_STYLE_URL: "https://tiles.openfreemap.org/styles/liberty"
      DEFAULT_MAP_LAT: -7.5755
      DEFAULT_MAP_LNG: 110.8243
      DEFAULT_MAP_ZOOM: 11
      DEFAULT_RADIUS_KM: 3.0
      GEOCODING_PROVIDER: geoapify
      GEOCODING_ENABLED: "true"
      GEOAPIFY_DAILY_CREDIT_BUDGET: 2500
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
